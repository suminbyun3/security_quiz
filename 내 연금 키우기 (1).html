<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 연금 키우기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
  /* 구성: 뒤에 '연금 타운' 광장(SVG 풍경, 고정) → 가운데 다마고치 기기 → 기기 LCD 안에 게임 */
  :root {
    color-scheme: light;
    --shell: #ff7fae; --shell-dark: #e0548b; --shell-light: #ffb3cf;
    --face: #fff7dc; --face-line: #ffd6e4;
    --lcd: #bdd0a2; --lcd-ink: #1f2a1a; --lcd-dim: #8c9c78;
    --btn: #fff2a8; --btn-ink: #6a4a00;
    --plum: #6b3a55;
    --font-pixel: "Press Start 2P", monospace;
    --font-cute: "Jua", "Noto Sans KR", sans-serif;
    --font-body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: #9fdcff; color: var(--plum); font-family: var(--font-body); overflow-x: hidden; word-break: keep-all; overflow-wrap: break-word; line-break: strict; }

  /* ---------- 배경: 연금 타운 ---------- */
  .world { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .world svg { width: 100%; height: 100%; display: block; }
  .drift1 { animation: drift 60s linear infinite; }
  .drift2 { animation: drift 90s linear infinite; animation-delay: -30s; }
  .drift3 { animation: drift 75s linear infinite; animation-delay: -55s; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }
  .bob { animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-14px); } }
  .hop { animation: hop 1.6s ease-in-out infinite; }
  .hop.d2 { animation-delay: -.5s; } .hop.d3 { animation-delay: -1s; } .hop.d4 { animation-duration: 2.1s; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-12px); } }
  .walk { animation: walk 14s ease-in-out infinite alternate; }
  @keyframes walk { to { transform: translateX(140px); } }
  .spray { stroke-dasharray: 6 8; animation: spray 1s linear infinite; }
  @keyframes spray { to { stroke-dashoffset: -28; } }
  .twinkle { animation: twinkle 2.4s ease-in-out infinite; }
  .twinkle:nth-child(2n) { animation-delay: -1.2s; } .twinkle:nth-child(3n) { animation-delay: -.6s; }
  @keyframes twinkle { 50% { opacity: .25; } }

  /* ---------- 앞: 기기 ---------- */
  .wrap {
    position: relative; z-index: 1; min-height: 100vh;
    display: grid; justify-items: center; align-content: start; gap: 14px;
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
  }
  .banner {
    font-family: var(--font-cute); font-size: 22px; color: #fff; letter-spacing: .02em;
    background: linear-gradient(#ff8fb8, #f0679c); padding: 6px 26px 8px; border-radius: 999px;
    box-shadow: 0 4px 0 #c94a7e, 0 10px 18px rgba(80,40,90,.18);
    position: relative; text-shadow: 0 2px 0 #c94a7e;
  }
  .banner::before, .banner::after { content: "★"; position: absolute; top: -10px; font-size: 18px; color: #ffe066; text-shadow: 0 2px 0 #e0a800; }
  .banner::before { left: -8px; transform: rotate(-18deg); } .banner::after { right: -8px; transform: rotate(18deg); }

  .device {
    position: relative; width: 100%; max-width: 392px; margin-top: 18px;
    background:
      radial-gradient(circle at 18% 22%, rgba(255,255,255,.55) 0 2px, transparent 3px) 0 0 / 34px 34px,
      linear-gradient(165deg, var(--shell-light), var(--shell) 38%, var(--shell-dark));
    border-radius: 50% 50% 46% 46% / 38% 38% 36% 36%;
    padding: 46px 22px 30px;
    box-shadow:
      0 24px 50px rgba(90,30,80,.32), 0 6px 0 #c4447a,
      inset 0 -10px 0 rgba(0,0,0,.10), inset 0 8px 0 rgba(255,255,255,.4);
    display: grid; gap: 14px;
  }
  .device::before { /* 반사광 */
    content: ""; position: absolute; left: 6%; top: 16%; width: 7%; height: 22%;
    border-radius: 50%; background: rgba(255,255,255,.5); filter: blur(1px); transform: rotate(14deg); pointer-events: none;
  }
  .ring { /* 키링 고리 */
    position: absolute; top: -26px; left: 50%; width: 46px; height: 46px; transform: translateX(-50%);
    border: 8px solid #c9b6ff; border-radius: 50%; box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 3px 0 #9d86e6; z-index: -1;
  }
  .logo { text-align: center; display: grid; gap: 4px; position: relative; }
  .logo .pix { font-family: var(--font-pixel); font-size: 10px; color: #fff; letter-spacing: .1em; text-shadow: 0 2px 0 var(--shell-dark); }
  .logo .ko { font-family: var(--font-cute); font-size: 20px; color: #fff; text-shadow: 0 2px 0 var(--shell-dark), 0 0 12px rgba(255,255,255,.5); }

  .face { /* LCD를 감싸는 페이스플레이트 */
    background:
      radial-gradient(circle, var(--face-line) 1.6px, transparent 2px) 0 0 / 16px 16px,
      var(--face);
    border-radius: 26px; padding: 10px 10px 8px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.8), inset 0 -3px 0 rgba(200,120,150,.25), 0 3px 0 rgba(150,40,90,.25);
    display: grid; gap: 8px;
  }
  .icons { display: flex; justify-content: space-around; }
  .ico { width: 26px; height: 26px; color: #d9a9bf; transition: color .2s, transform .2s; }
  .ico svg { width: 100%; height: 100%; display: block; fill: currentColor; }
  .ico.on { color: #ff4f93; transform: scale(1.15); filter: drop-shadow(0 0 4px rgba(255,79,147,.5)); }
  .ico.warn { color: #ff4f93; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  .screen {
    background: var(--lcd); border: 6px solid #4a3340; border-radius: 16px;
    box-shadow: inset 0 0 0 3px #a6b98c, inset 0 4px 14px rgba(0,0,0,.25);
    padding: 12px 12px 10px; color: var(--lcd-ink); min-height: 360px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
    position: relative; overflow: hidden;
  }
  .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px); }
  .hud { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; }
  .hud .hearts { font-family: var(--font-pixel); font-size: 9px; letter-spacing: 2px; }
  .stage { display: grid; gap: 7px; align-content: start; }
  .pet { display: grid; place-items: center; height: 92px; }
  .sprite { display: grid; grid-template-columns: repeat(12, 7px); }
  .sprite i { width: 7px; height: 7px; display: block; }
  .sprite i.p { background: var(--lcd-ink); }
  .sprite i.s { background: var(--lcd-dim); }
  .bounce { animation: bounce 1.2s steps(2) infinite; }
  @keyframes bounce { 50% { transform: translateY(-4px); } }
  .shake { animation: shake .4s steps(4) 2; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .say { font-size: 14px; font-weight: 700; text-align: center; line-height: 1.4; text-wrap: balance; }
  .q { font-size: 14.5px; font-weight: 700; line-height: 1.45; text-wrap: pretty; border-top: 2px dashed var(--lcd-dim); padding-top: 8px; }
  .q small { display: block; font-family: var(--font-pixel); font-size: 8px; margin-bottom: 6px; opacity: .8; }
  .opts { display: grid; gap: 5px; font-size: 13px; font-weight: 500; line-height: 1.35; }
  .opts div { display: flex; gap: 8px; align-items: flex-start; }
  .opts b { font-family: var(--font-pixel); font-size: 9px; padding-top: 3px; flex: none; }
  .log { display: grid; gap: 4px; font-size: 12.5px; border-top: 2px dashed var(--lcd-dim); padding-top: 8px; line-height: 1.4; }
  .log .row { display: flex; justify-content: space-between; gap: 8px; }
  .log .big { font-weight: 700; font-size: 13.5px; }
  .gauge { font-size: 11px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .gauge .track { flex: 1; height: 10px; border: 2px solid var(--lcd-ink); display: flex; gap: 1px; padding: 1px; }
  .gauge .track i { flex: 1; }
  .gauge .track i.on { background: var(--lcd-ink); }
  .end .title { font-size: 16px; font-weight: 700; text-align: center; }
  .end .sub { font-size: 12px; text-align: center; font-weight: 700; }
  .end .desc { font-size: 13px; text-align: center; line-height: 1.45; }
  .reveal { margin: 0; padding: 8px 0 0; list-style: none; display: grid; gap: 5px; font-size: 12px; line-height: 1.45; border-top: 2px dashed var(--lcd-dim); }
  .reveal li::before { content: "※ "; font-weight: 700; }

  .buttons { display: flex; justify-content: center; gap: 20px; padding-top: 4px; }
  .pbtn {
    width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #fffdf0, var(--btn) 55%, #ecd06a);
    box-shadow: 0 6px 0 #c4a03a, 0 10px 14px rgba(90,30,60,.25), inset 0 -3px 0 rgba(0,0,0,.06);
    font-family: var(--font-pixel); font-size: 14px; color: var(--btn-ink);
    transition: transform .08s, box-shadow .08s;
  }
  .buttons .pbtn:nth-child(2) { transform: translateY(10px); }
  .buttons .pbtn:nth-child(2):active, .buttons .pbtn:nth-child(2).press { transform: translateY(15px); }
  .pbtn:active, .pbtn.press { transform: translateY(5px); box-shadow: 0 1px 0 #c4a03a, 0 3px 6px rgba(0,0,0,.2); }
  .pbtn:focus-visible, .ff:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .pbtn:disabled, .ff:disabled { opacity: .5; cursor: default; }
  .ff {
    justify-self: center; margin-top: 8px; border: 0; cursor: pointer; border-radius: 999px;
    padding: 8px 18px; background: #6b3a55; color: #fff;
    font-family: var(--font-body); font-size: 12px; font-weight: 700;
    box-shadow: 0 3px 0 #43233a;
  }
  .ff:active { transform: translateY(2px); box-shadow: 0 1px 0 #43233a; }
  .hint { text-align: center; font-size: 12px; color: #fff; font-weight: 700; text-shadow: 0 1px 0 var(--shell-dark); }
  .foot {
    margin: 0; font-size: 12px; color: var(--plum); text-align: center; max-width: 392px;
    background: rgba(255,255,255,.82); padding: 8px 16px; border-radius: 999px;
    box-shadow: 0 4px 12px rgba(80,40,90,.12);
  }
  @media (prefers-reduced-motion: reduce) {
    .bounce, .shake, .drift1, .drift2, .drift3, .bob, .hop, .walk, .spray, .twinkle, .ico.warn { animation: none; }
  }
</style>
</head>
<body>

<!-- ===== 배경: 연금 타운 광장 ===== -->
<div class="world" aria-hidden="true">
<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ccbff"/><stop offset=".7" stop-color="#cdeeff"/><stop offset="1" stop-color="#e9f8ff"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fffbe0"/><stop offset=".55" stop-color="#fff3a8" stop-opacity=".9"/><stop offset="1" stop-color="#fff3a8" stop-opacity="0"/></radialGradient>
    <g id="cloud"><circle cx="0" cy="0" r="34"/><circle cx="40" cy="-18" r="44"/><circle cx="88" cy="-4" r="36"/><circle cx="120" cy="10" r="26"/><rect x="-30" y="0" width="170" height="34" rx="17"/></g>

  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1040" cy="110" r="110" fill="url(#sun)"/>

  <!-- 구름 -->
  <g fill="#fff" opacity=".95">
    <g class="drift1"><use href="#cloud" x="0" y="120"/></g>
    <g class="drift2"><use href="#cloud" x="0" y="230" transform="scale(.7)"/></g>
    <g class="drift3"><use href="#cloud" x="0" y="80" transform="scale(1.15)"/></g>
  </g>

  <!-- 열기구 -->
  <g class="bob">
    <g transform="translate(905 150)">

      <path d="M0 -60 C18 -60 24 -30 24 -6 C24 24 10 42 6 62 H-6 C-10 42 -24 24 -24 -6 C-24 -30 -18 -60 0 -60Z" fill="#ff8fb8"/>
      <path d="M-56 -6 H56" stroke="#fff" stroke-width="5" opacity=".7"/>
      <path d="M-10 62 L-12 80 M10 62 L12 80" stroke="#8a5a3c" stroke-width="2"/>

  <!-- 언덕 -->
  <ellipse cx="200" cy="500" rx="360" ry="90" fill="#a8e6b0"/>
  <ellipse cx="1000" cy="505" rx="380" ry="95" fill="#9fe0a8"/>
  <ellipse cx="620" cy="510" rx="300" ry="70" fill="#b5ecbc"/>

  <!-- 건물들 -->
  <!-- 시계탑 -->
  <g transform="translate(70 0)">
    <rect x="0" y="250" width="74" height="250" rx="8" fill="#d7c4ff"/>
    <path d="M-8 254 L37 196 L82 254Z" fill="#ff8fb8"/>
    <circle cx="37" cy="300" r="22" fill="#fff"/><circle cx="37" cy="300" r="22" fill="none" stroke="#a88be8" stroke-width="4"/>
    <path d="M37 300 V286 M37 300 H48" stroke="#6b3a55" stroke-width="3" stroke-linecap="round"/>
    <rect x="20" y="350" width="34" height="40" rx="17" fill="#fff" opacity=".8"/>
    <rect x="22" y="440" width="30" height="60" rx="15" fill="#a88be8"/>
  </g>
  <!-- 적금 베이커리 -->
  <g transform="translate(170 0)">
    <rect x="0" y="370" width="170" height="130" rx="10" fill="#ffd6e6"/>
    <path d="M-10 372 Q85 318 180 372Z" fill="#ff7fae"/>
    <g>
      <path d="M0 372 h170 v26 h-170z" fill="#fff"/>
      <path d="M0 372 h21 v26 q-10 10 -21 0z M42 372 h21 v26 q-10 10 -21 0z M84 372 h21 v26 q-10 10 -21 0z M126 372 h21 v26 q-10 10 -21 0z" fill="#ff5f9a"/>
      <path d="M21 398 q11 10 21 0 M63 398 q11 10 21 0 M105 398 q11 10 21 0 M147 398 q11 10 23 0" fill="#fff"/>
    </g>
    <rect x="24" y="420" width="52" height="40" rx="8" fill="#bfe8ff"/>
    <rect x="98" y="430" width="44" height="70" rx="20" fill="#d98aa8"/>
    <rect x="30" y="338" width="110" height="26" rx="13" fill="#fff"/>
    <text x="85" y="357" text-anchor="middle" font-family="Jua, sans-serif" font-size="16" fill="#e0548b">적금 베이커리</text>
  </g>
  <!-- 버섯집 -->
  <g transform="translate(360 0)">
    <rect x="20" y="420" width="60" height="80" rx="14" fill="#fff4dc"/>
    <path d="M-12 430 C-12 360 112 360 112 430Z" fill="#ff6b6b"/>
    <circle cx="20" cy="400" r="9" fill="#fff"/><circle cx="56" cy="384" r="12" fill="#fff"/><circle cx="88" cy="408" r="8" fill="#fff"/>
    <rect x="38" y="452" width="24" height="48" rx="12" fill="#c98a5a"/>
  </g>
  <!-- 연금이네 회사 (가운데) -->
  <g transform="translate(510 0)">
    <rect x="0" y="230" width="180" height="270" rx="12" fill="#bfe1ff"/>

      <rect x="20" y="270" width="30" height="26" rx="6"/><rect x="75" y="270" width="30" height="26" rx="6"/><rect x="130" y="270" width="30" height="26" rx="6"/>
      <rect x="20" y="315" width="30" height="26" rx="6"/><rect x="75" y="315" width="30" height="26" rx="6"/><rect x="130" y="315" width="30" height="26" rx="6"/>
      <rect x="20" y="360" width="30" height="26" rx="6"/><rect x="75" y="360" width="30" height="26" rx="6"/><rect x="130" y="360" width="30" height="26" rx="6"/>
      <rect x="20" y="405" width="30" height="26" rx="6"/><rect x="130" y="405" width="30" height="26" rx="6"/>
    </g>
    <rect x="66" y="440" width="48" height="60" rx="8" fill="#6aa8de"/>
    <rect x="30" y="196" width="120" height="30" rx="15" fill="#fff"/>
    <text x="90" y="217" text-anchor="middle" font-family="Jua, sans-serif" font-size="17" fill="#3b7fc4">연금이네 회사</text>
  </g>
  <!-- 연금은행 -->
  <g transform="translate(760 0)">

  <!-- 광장 바닥 -->

  <!-- 주민들 (오리지널) -->
  <!-- 돼지저금통 -->
  <g class="walk"><g class="hop"><g transform="translate(130 700)">
    <ellipse cx="0" cy="40" rx="40" ry="8" fill="#000" opacity=".08"/>
    <path d="M-30 -24 l-8 -20 l20 10z M18 -26 l14 -18 l2 22z" fill="#ff9cc0"/>

    <circle cx="4" cy="-8" r="5" fill="#3a2a33"/><circle cx="5.5" cy="-9.5" r="1.6" fill="#fff"/>
    <ellipse cx="-12" cy="8" rx="7" ry="4" fill="#ff8fb8" opacity=".7"/>
    <rect x="-28" y="28" width="12" height="12" rx="5" fill="#ff8fb8"/><rect x="10" y="28" width="12" height="12" rx="5" fill="#ff8fb8"/>
  </g></g></g>

<script>

  chick: ["............","....pppp....","...p....p...","..p.p..p.p..","..p......p..","pp.p.pp..p..","..p.ppp.p...","...pppp.....","..p.s..s.p..","..p......p..","...pppppp...","....p..p...."],

const STAGES = [
  { key: "egg", name: "인턴" }, { key: "chick", name: "사원" },
  { key: "chicken", name: "팀장" }, { key: "phoenix", name: "임원" },
];
const TH = [0, 40, 150, 450];             // 승진 기준 몸무게(kg)
const stageOf = e => e >= TH[3] ? 3 : e >= TH[2] ? 2 : e >= TH[1] ? 1 : 0;
const START_AGE = 25, END_AGE = 65;

/* ===== 숨은 규칙 =====
   몸무게 1kg = 연금 잔고 100만 원.
   alloc: s(안전) / g(성장) / r(고위험) 비중. 매년 경기에 따라 몸무게가 불어나거나 줄어듦.
   habit: 매년 자동으로 쌓이는 양(저축 습관). 퇴직금 몫 3kg은 기본.  */
const WEATHER = [
  { k: "boom",  icon: "☀", name: "호황",   p: .20, r: { s: .02, g: .22,  r: .70 } },
  { k: "norm",  icon: "☁", name: "평년",   p: .45, r: { s: .02, g: .09,  r: .06 } },
  { k: "slump", icon: "☂", name: "불황",   p: .25, r: { s: .02, g: -.06, r: -.30 } },
  { k: "crash", icon: "⚡", name: "대폭락", p: .10, r: { s: .01, g: -.20, r: -.60 } },
];

const rnd = () => Math.random();
const pick = arr => arr[Math.floor(rnd() * arr.length)];
function shift(S, target, amt) { for (const k of ["s", "g", "r"]) S.alloc[k] = S.alloc[k] * (1 - amt) + (k === target ? amt : 0); }
const addItem = (S, it) => { if (!S.items.includes(it)) S.items.push(it); };
const hp = (S, d) => { S.hearts = Math.max(0, Math.min(3, S.hearts + d)); };
const habit = (S, d) => { S.habit = Math.max(0, Math.min(4, S.habit + d)); };
const cut = (S, f) => { S.exp = Math.max(1, S.exp * (1 - f)); };

/* ===== 회사 사건 카드 (정답 숨김) ===== */

    ["다 갖다 버리고 새로 시작", S => { S.alloc = { s: 1, g: 0, r: 0 }; return "텅 빈 책상… 시원하다"; }],
  ]},
];
const CRISIS = { q: "경기 한파! 연금이 통장이 녹아내리고 있다…", o: [
  ["다 팔고 숨는다", S => { shift(S, "s", .8); hp(S, 1); S.flags.sold++; return "이불 속이 제일 안전해"; }],
  ["눈 질끈 감고 버틴다", S => { hp(S, -1); S.flags.held++; return "앱 삭제. 안 보면 그만"; }],
  ["오히려 더 산다", S => { shift(S, "g", .3); S.exp += 2; hp(S, -1); S.flags.held++; return "세일 기간이라고 생각하자"; }],
]};

/* ===== 엔딩 ===== */
function ending(S) {
  const n = Math.max(1, S.years), avg = k => S.sumAlloc[k] / n, f = S.flags;
  if (f.withdraw >= 4) return { name: "반짝이 참새", desc: "소지품은 화려한데 몸은 가볍다! 인생 즐길 줄 아는 참새예요." };
  if (S.demotions >= 2) return { name: "롤러코스터 연금이", desc: `올라갔다 떨어졌다, 강등만 ${S.demotions}번. 심장이 남아나질 않았어요.` };
  if (avg("r") > .21) return { name: "승부사 도박닭", desc: "언제나 한 방을 노렸어요. 터지면 대박, 아니면… 아시죠?" };
  if (S.burnouts >= 5) return { name: "번아웃 너구리", desc: "일은 열심히, 마음은 바닥. 쉬는 것도 실력이에요." };
  if (f.held >= 5 && f.sold <= 2 && avg("g") > .18) return { name: "존버 불사조", desc: "폭풍 속에서도 버틴 끝에 날아올랐어요. 전설의 존버러." };
  if (avg("s") > .68) return { name: "예금 거북이", desc: "절대 안 잃는 대신 아주 천천히 걷는 거북이예요." };
  return { name: "무난한 김연금 사원", desc: "튀진 않지만 꾸준히. 회사마다 한 명씩 있는 그 사람." };
}
function reveals(S) {
  const f = S.flags, won = Math.round(S.exp * 100), monthly = Math.round(S.exp * 100 / 240);
  const out = [`사실 연금이 몸무게 1kg = 연금 100만 원이었어요. 65세 잔고 ${won.toLocaleString()}만 원 → 20년 동안 매달 약 ${monthly}만 원.`];
  const pool = [];
  if (f.withdraw) pool.push("'절대 열지 마' 봉투랑 이직 때 받은 퇴직금은 사실 연금이었어요. 꺼내 쓴 순간 복리도 같이 나가요.");
  if (f.sold) pool.push("한파 때 팔고 숨은 건 손실 확정이었어요. 버틴 연금이는 다음 호황에 몰아서 컸어요.");
  if (!f.tax) pool.push("12월의 그 서류는 연말정산. 연금저축+IRP 합쳐 900만 원까지 넣으면 최대 16.5%를 돌려받아요.");
  if (f.dc && !f.sold) pool.push("\"네가 굴릴래?\"는 DC형 퇴직연금이었어요. 직접 굴리면 결과도 내 몫이에요.");
  if (S.habit >= 3) pool.push("은행 자동이체가 연금이를 키운 숨은 공신이었어요.");
  return out.concat(pool.slice(0, 2));
}

/* ===== 상태 ===== */
const KEY = "pensiongotchi-v2";
function fresh() {
  return { age: START_AGE, exp: 5, hearts: 3, habit: 1, alloc: { s: 1, g: 0, r: 0 },
    sumAlloc: { s: 0, g: 0, r: 0 }, years: 0, deck: [], cur: 0, lastBad: false,
    items: [], flags: { withdraw: 0, tax: 0, sold: 0, held: 0, dc: 0, db: 0 },
    demotions: 0, burnouts: 0, skip: false, ended: false };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && !s.ended && typeof s.age === "number" ? s : null; } catch (e) { return null; } }

let S = load(), mode = "cover";

/* ===== 1년 흐르기 ===== */
function drawWeather() { let x = rnd(); for (const w of WEATHER) { if ((x -= w.p) < 0) return w; } return WEATHER[1]; }
function yearTick(skip) {
  const w = drawWeather(), a = S.alloc;
  const ret = a.s * w.r.s + a.g * w.r.g + a.r * w.r.r;
  const before = S.exp, sb = stageOf(before);
  S.exp = Math.max(1, S.exp * (1 + ret) + 3 + (skip ? 0 : S.habit * 2.5));
  const exposure = a.g + a.r;
  S.lastBad = (w.k === "slump" || w.k === "crash") && exposure > .3;
  if (w.k === "crash" && exposure > .3) hp(S, -1);
  for (const k of ["s", "g", "r"]) S.sumAlloc[k] += a[k];
  S.years++; S.age++;
  const sa = stageOf(S.exp);
  if (sa < sb) S.demotions++;
  return { w, before, after: S.exp, sb, sa };
}
function burnout(notes) {
  if (S.hearts <= 0) { S.hearts = 2; S.burnouts++; cut(S, .1); notes.push("번아웃… 연금이가 1년 휴직했어요"); }
}
function nextEvent() {
  if (S.lastBad) { S.lastBad = false; S.cur = -1; return; }
  if (!S.deck.length) S.deck = EVENTS.map((_, k) => k).sort(() => rnd() - .5);
  S.cur = S.deck.pop();
}
const curEvent = () => S.cur === -1 ? CRISIS : EVENTS[S.cur];

/* ===== 화면 ===== */
const $ = id => document.getElementById(id);
const fmt = e => e < 100 ? e.toFixed(1) : String(Math.round(e));
function sprite(key, cls) {
  const el = document.createElement("div"); el.className = "sprite " + (cls || "");
  SPRITES[key].forEach(row => [...row].forEach(ch => { const px = document.createElement("i"); if (ch !== ".") px.className = ch; el.appendChild(px); }));
  return el;
}
function hud() {
  const st = S ? stageOf(S.exp) : 0;
  $("hudLeft").textContent = S ? `${S.age}세 · ${STAGES[st].name} 연금이` : "입사 대기 중";
  const h = S ? S.hearts : 3;
  $("hearts").textContent = "♥".repeat(h) + "♡".repeat(3 - h);
  const t = $("track"); t.innerHTML = "";
  let fill = 0;
  if (S) { fill = st === 3 ? 1 : (S.exp - TH[st]) / (TH[st + 1] - TH[st]); }
  for (let k = 0; k < 14; k++) { const b = document.createElement("i"); if (k < Math.round(fill * 14)) b.className = "on"; t.appendChild(b); }
  $("gLabel").textContent = S && st === 3 ? "최고 직급" : "승진까지";
  $("kg").textContent = (S ? fmt(S.exp) : "5") + "kg";
}
function setButtons(on, labels) {
  labels = labels || ["A", "B", "C"];
  ["bA", "bB", "bC"].forEach((id, k) => { $(id).disabled = !on[k]; $(id).textContent = labels[k]; });
}
function setFF(on) { $("bF").disabled = !on; }
function screen(petKey, petCls, sayText) {
  const st = $("stage"); st.innerHTML = "";
  const pet = document.createElement("div"); pet.className = "pet"; pet.appendChild(sprite(petKey, petCls)); st.appendChild(pet);
  if (sayText !== undefined) { const say = document.createElement("div"); say.className = "say"; say.textContent = sayText; st.appendChild(say); }
  return st;
}
function addHTML(st, cls, html) { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; st.appendChild(d); return d; }

function renderCover() {
  mode = "cover";
  if (S) {
    const st = screen(STAGES[stageOf(S.exp)].key, "bounce", "연금이가 기다리고 있었어요!");
    addHTML(st, "q", `${S.age}세 ${STAGES[stageOf(S.exp)].name}, 몸무게 ${fmt(S.exp)}kg. 오늘도 회사에서 무슨 일이 생길까?`);
    addHTML(st, "opts", "<div><b>A</b><span>이어서 키우기</span></div><div><b>C</b><span>새 연금이 입양 (지금 연금이는 사라져요)</span></div>");
    setButtons([true, false, true]);
    $("hint").textContent = "A 이어하기 · C 새로 시작";
  } else {
    const st = screen("egg", "bounce", "회사원 연금이가 입사를 기다려요");
    addHTML(st, "q", "매년 회사에서 사건이 터지고, 경기는 아무도 몰라요. 65세 은퇴 날 연금이는 뭐가 돼 있을까?");
    addHTML(st, "opts", "<div><b>A</b><span>연금이 입사시키기</span></div>");
    setButtons([true, false, false]);
    $("hint").textContent = "A 버튼을 눌러 시작";
  }
  setFF(false); hud();
}

function renderEvent() {
  mode = "event";
  const ev = curEvent();
  const st = screen(STAGES[stageOf(S.exp)].key, "bounce", S.cur === -1 ? "흐어어… 몸이 줄어든다" : "");
  addHTML(st, "q", `<small>AGE ${S.age}${S.cur === -1 ? " · 긴급" : ""}</small>${ev.q}`);
  addHTML(st, "opts", ev.o.map((c, k) => `<div><b>${"ABC"[k]}</b><span>${c[0]}</span></div>`).join(""));
  setButtons([true, true, true]); setFF(true);
  $("hint").textContent = "A · B · C 중에 골라요";
  hud();
}

function stageMsg(t) {
  if (t.sa > t.sb) return `승진! ${STAGES[t.sa].name} 연금이가 됐어요`;
  if (t.sa < t.sb) return t.sa === 0 ? "강등… 다시 인턴으로 돌아갔어요" : `강등… ${STAGES[t.sa].name}(으)로 내려갔어요`;
  return "";
}

function renderYear(sayText, t, notes) {
  mode = "year";
  const diff = t.after - t.before, bad = diff < 0 || t.sa < t.sb;
  const st = screen(STAGES[t.sa].key, bad ? "shake" : "bounce", sayText);
  const sm = stageMsg(t);
  addHTML(st, "log",
    `<div class="row"><span>올해 경기</span><span>${t.w.icon} ${t.w.name}</span></div>` +
    `<div class="row"><span>연금이 몸무게</span><span>${fmt(t.before)} → ${fmt(t.after)}kg (${diff >= 0 ? "▲" : "▼"}${fmt(Math.abs(diff))})</span></div>` +
    (sm ? `<div class="big">${sm}</div>` : "") +
    notes.map(n => `<div class="big">${n}</div>`).join(""));
  const done = S.age >= END_AGE;
  setButtons([true, false, false], [done ? "★" : "▶", "B", "C"]);
  setFF(!done);
  $("hint").textContent = done ? "A 은퇴식 보러 가기" : "A 다음 해로";
  save(); hud();
}

function choose(k) {
  const opt = curEvent().o[k];
  S.skip = false;
  const say = opt[1](S);
  const notes = []; burnout(notes);
  const t = yearTick(S.skip);
  burnout(notes);
  renderYear(say, t, notes);
}

function fastForward() {
  const startExp = S.exp, startStage = stageOf(S.exp), icons = [];
  let dem = 0, n = 0;
  while (n < 5 && S.age < END_AGE) {
    const t = yearTick(false); icons.push(t.w.icon); if (t.sa < t.sb) dem++; n++;
  }
  mode = "ff";
  const sa = stageOf(S.exp), diff = S.exp - startExp;
  const say = diff >= 0 ? "휘리릭~ 시간이 흘렀어요" : "휘리릭… 뭔가 잃어버린 느낌";
  const st = screen(STAGES[sa].key, diff >= 0 ? "bounce" : "shake", say);
  const sm = stageMsg({ sb: startStage, sa });
  addHTML(st, "log",
    `<div class="row"><span>${n}년간 경기</span><span>${icons.join(" ")}</span></div>` +
    `<div class="row"><span>연금이 몸무게</span><span>${fmt(startExp)} → ${fmt(S.exp)}kg</span></div>` +
    (sm ? `<div class="big">${sm}</div>` : "") +
    (dem ? `<div class="big">그사이 강등을 ${dem}번 겪었어요…</div>` : ""));
  const done = S.age >= END_AGE;
  setButtons([true, false, false], [done ? "★" : "▶", "B", "C"]);
  setFF(!done);
  $("hint").textContent = done ? "A 은퇴식 보러 가기" : "A 계속 · 한 번 더 빨리감기도 OK";
  save(); hud();
}

function renderEnd() {
  mode = "end";
  S.ended = true; save();
  const e = ending(S), sa = stageOf(S.exp);
  const st = screen(STAGES[sa].key, "bounce");
  addHTML(st, "end",
    `<div class="title">${e.name}</div>` +
    `<div class="sub">65세 은퇴 · 최종 직급 ${STAGES[sa].name} · ${fmt(S.exp)}kg</div>` +
    `<div class="desc">${e.desc}</div>` +
    (S.items.length ? `<div class="sub">소지품: ${S.items.join(", ")}</div>` : ""));
  const ul = document.createElement("ul"); ul.className = "reveal";
  ul.innerHTML = reveals(S).map(r => `<li>${r}</li>`).join("");
  st.appendChild(ul);
  setButtons([true, false, true], ["↻", "B", "⎘"]); setFF(false);
  $("hint").textContent = "A 새 연금이 입양 · C 결과 복사";
  hud();
}

async function copyResult() {
  const e = ending(S);
  const text = `[내 연금 키우기] 우리 연금이는 '${e.name}' (최종 ${STAGES[stageOf(S.exp)].name}, ${fmt(S.exp)}kg)\n${e.desc}`;
  try { await navigator.clipboard.writeText(text); $("hint").textContent = "복사됐어요! 친구 연금이랑 비교해봐요"; }
  catch (err) { $("hint").textContent = "복사가 막혔어요. 화면을 캡처해서 공유해주세요"; }
}

function press(k) {
  const id = ["bA", "bB", "bC"][k]; $(id).classList.add("press"); setTimeout(() => $(id).classList.remove("press"), 120);
  if (mode === "cover") {
    if (k === 2) { S = fresh(); }
    if (!S) S = fresh();
    nextEvent(); save(); renderEvent(); return;
  }
  if (mode === "event") { choose(k); return; }
  if (mode === "year" || mode === "ff") {
    if (S.age >= END_AGE) { renderEnd(); return; }
    nextEvent(); save(); renderEvent(); return;
  }
  if (mode === "end") {
    if (k === 0) { try { localStorage.removeItem(KEY); } catch (e) {} S = null; renderCover(); }
    if (k === 2) copyResult();
  }
}

["bA", "bB", "bC"].forEach((id, k) => $(id).addEventListener("click", () => press(k)));
$("bF").addEventListener("click", () => { if (mode === "event" || mode === "year" || mode === "ff") fastForward(); });
/* ===== 연금 타운 바닥 타일 ===== */
(function tiles() {
  const g = document.getElementById("tiles"); if (!g) return;
  const H = 496, B = 800, R = 9, C = 14, cx = 600;
  const yAt = t => H + (B - H) * Math.pow(t, 1.7);
  const xAt = (c, y) => { const u = (y - H) / (B - H); return cx + c * (46 + (140 - 46) * u); };
  let out = "";
  for (let r = 0; r < R; r++) {
    const y0 = yAt(r / R), y1 = yAt((r + 1) / R);
    for (let c = -C; c < C; c++) {
      if ((r + c) % 2 === 0) continue;
      out += `<polygon points="${xAt(c, y0)},${y0} ${xAt(c + 1, y0)},${y0} ${xAt(c + 1, y1)},${y1} ${xAt(c, y1)},${y1}" fill="#fbead6"/>`;
    }
  }
  g.innerHTML = out;
})();

/* ===== 페이스플레이트 아이콘: 지금 화면에 맞춰 불 켜기 ===== */
const ICON_FOR = { cover: "i-bulb", event: "i-case", year: "i-chart", ff: "i-fast", end: "i-gift" };
function lightIcons() {
  document.querySelectorAll(".ico").forEach(el => el.classList.remove("on", "warn"));
  const id = ICON_FOR[mode]; if (id) $(id).classList.add("on");
  if (mode === "end") $("i-coin").classList.add("on");
  if (S && S.hearts <= 1 && mode !== "end") $("i-heart").classList.add("warn");
  if (S && mode !== "end") $("i-save").classList.add("on");
}
for (const name of ["renderCover", "renderEvent", "renderYear", "fastForward", "renderEnd"]) {
  const f = window[name];
  window[name] = function (...a) { const r = f.apply(this, a); lightIcons(); return r; };
}
renderCover();
</script>
</body>
</html>
